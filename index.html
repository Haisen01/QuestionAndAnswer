  <title>Quiz App</title>
  <style>
    /* Existing CSS */
    #timer {
      font-size: 1.2rem;
      color: var(--question-color);
      margin-bottom: 20px;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }
    :root {
      --hue-neutral: 200;
      --hue-wrong: 0;
      --hue-correct: 145;
      --primary-bg: hsl(200, 100%, 20%);
      --neutral-bg: white;
      --btn-bg: hsl(200, 100%, 50%);
      --btn-border: hsl(200, 100%, 30%);
      --btn-hover: hsl(200, 100%, 30%);
      --btn-text: white;
      --btn-correct-bg: hsl(145, 100%, 50%);
      --btn-correct-text: black;
      --btn-wrong-bg: hsl(0, 100%, 50%);
      --question-color: hsl(200, 100%, 30%);
      --transition-duration: 0.3s;
      --result-text: black; /* Updated color for better readability */
    }
    body {
      background-image: linear-gradient(to top, #09203f 0%, #537895 100%);
      color: white;
      padding: 0;
      margin: 0;
      display: flex;
      width: 100vw;
      height: 100vh;
      justify-content: center;
      align-items: center;
    }
    body.correct {
      --hue: var(--hue-correct);
      transition: background-color var(--transition-duration);
    }
    body.wrong {
      --hue: var(--hue-wrong);
      transition: background-color var(--transition-duration);
    }
    .container {
      width: 800px;
      max-width: 90%;
      background-color: var(--neutral-bg);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      text-align: center;
      transition: opacity var(--transition-duration);
    }
    #question-container {
      margin-bottom: 20px;
    }
    #question-info {
      font-size: 1.2rem;
      color: var(--question-color);
      margin-bottom: 10px;
    }
    #question {
      font-size: 1.5rem;
      color: var(--question-color);
      margin-bottom: 20px;
      transition: color var(--transition-duration);
    }
    #result {
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: var(--result-text); /* Ensure the result text color is visible */
    }
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn {
      border: 2px solid var(--btn-border);
      background-color: var(--btn-bg);
      border-radius: 8px;
      padding: 10px;
      color: var(--btn-text);
      font-size: 1rem;
      cursor: pointer;
      transition: background-color var(--transition-duration), transform var(--transition-duration), border-color var(--transition-duration);
      outline: none;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    .btn:hover {
      border-color: var(--btn-hover);
      background-color: var(--btn-hover);
    }
    .btn:active {
      transform: scale(0.95);
    }
    .btn.correct {
      background-color: var(--btn-correct-bg);
      color: var(--btn-correct-text);
    }
    .btn.wrong {
      background-color: var(--btn-wrong-bg);
      color: var(--btn-text);
    }
    .start-btn, .next-btn {
      font-size: 1.5rem;
      font-weight: bold;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      cursor: pointer;
      transition: background-color var(--transition-duration), transform var(--transition-duration);
    }
    .start-btn:hover, .next-btn:hover {
      background-color: var(--btn-hover);
    }
    .start-btn:active, .next-btn:active {
      transform: scale(0.95);
    }
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .hide {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="question-container" class="hide">
      <div id="timer">20</div>
      <div id="question-info" class="hide">Score: <span id="current-score">0</span> / <span id="total-questions">0</span></div>
      <div id="question">Question</div>
      <div id="answer-buttons" class="btn-grid">
        <button class="btn">Answer 1</button>
        <button class="btn">Answer 2</button>
        <button class="btn">Answer 3</button>
        <button class="btn">Answer 4</button>
      </div>
    </div>
    <div id="result-container" class="hide">
      <div id="result">You scored <span id="score"></span> out of <span id="total-questions"></span></div>
    </div>
    <div class="controls">
      <button id="start-btn" class="start-btn btn">Start</button>
      <button id="next-btn" class="next-btn btn hide">Next</button>
    </div>
  </div>
  
  
  <script>
    const startButton = document.getElementById('start-btn');
    const nextButton = document.getElementById('next-btn');
    const questionContainerElement = document.getElementById('question-container');
    const resultContainerElement = document.getElementById('result-container');
    const resultElement = document.getElementById('result');
    const scoreElement = document.getElementById('score');
    const totalQuestionsElement = document.getElementById('total-questions');
    const questionElement = document.getElementById('question');
    const answerButtonsElement = document.getElementById('answer-buttons');
    const timerElement = document.getElementById('timer');
    const questionInfoElement = document.getElementById('question-info');
    const currentScoreElement = document.getElementById('current-score');

    let shuffledQuestions, currentQuestionIndex, score, timerInterval;

    startButton.addEventListener('click', startGame);
    nextButton.addEventListener('click', () => {
      currentQuestionIndex++;
      setNextQuestion();
    });

    function startGame() {
      startButton.classList.add('hide');
      resultContainerElement.classList.add('hide');
      shuffledQuestions = questions.sort(() => Math.random() - 0.5);
      currentQuestionIndex = 0;
      score = 0;
      questionContainerElement.classList.remove('hide');
      setNextQuestion();
    }

    function setNextQuestion() {
      resetState();
      if (currentQuestionIndex < shuffledQuestions.length) {
        showQuestion(shuffledQuestions[currentQuestionIndex]);
        startTimer();
        nextButton.classList.add('hide'); // Hide the Next button initially
      } else {
        showResults();
      }
    }

    function showQuestion(question) {
      // Update the question-info with score and total questions
      currentScoreElement.innerText = score;
      totalQuestionsElement.innerText = shuffledQuestions.length;
      questionInfoElement.classList.remove('hide');

      // Update the question text
      questionElement.innerText = question.question;

      // Clear previous answers
      answerButtonsElement.innerHTML = '';

      // Display the answer buttons
      question.answers.forEach(answer => {
        const button = document.createElement('button');
        button.innerText = answer.text;
        button.classList.add('btn');
        if (answer.correct) {
          button.dataset.correct = answer.correct;
        }
        button.addEventListener('click', selectAnswer);
        answerButtonsElement.appendChild(button);
      });
    }

    function resetState() {
      clearStatusClass(document.body);
      while (answerButtonsElement.firstChild) {
        answerButtonsElement.removeChild(answerButtonsElement.firstChild);
      }
      clearTimer();
      questionInfoElement.classList.add('hide');
    }

    function startTimer() {
      let timeLeft = 6;
      timerElement.innerText = timeLeft;
      timerInterval = setInterval(() => {
        timeLeft--;
        timerElement.innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeOut();
        }
      }, 1000);
    }

    function clearTimer() {
      clearInterval(timerInterval);
      timerElement.innerText = '6'; // Reset timer display
    }

    function handleTimeOut() {
      selectAnswer({ target: null }); // Simulate timeout by calling selectAnswer with no target
      if (shuffledQuestions.length > currentQuestionIndex + 1) {
        nextButton.classList.remove('hide');
      } else {
        showResults();
      }
    }

    function selectAnswer(e) {
      clearTimer();
      const selectedButton = e.target;
      const correct = selectedButton ? selectedButton.dataset.correct : false;
      if (correct) {
        score++;
      }
      setStatusClass(document.body, correct);
      Array.from(answerButtonsElement.children).forEach(button => {
        setStatusClass(button, button.dataset.correct);
      });
      if (shuffledQuestions.length > currentQuestionIndex + 1) {
        nextButton.classList.remove('hide');
      } else {
        showResults();
      }
    }

    function showResults() {
      questionContainerElement.classList.add('hide');
      resultContainerElement.classList.remove('hide');
      scoreElement.innerText = score;
      totalQuestionsElement.innerText = shuffledQuestions.length;
      nextButton.classList.add('hide'); // Ensure Next button is hidden on results

      // Display the result message based on the score
      if (score > 3) {
        resultElement.innerHTML = `You passed!<br>Your score: ${score} out of ${shuffledQuestions.length}`;
      } else {
        resultElement.innerHTML = `You failed.<br>Your score: ${score} out of ${shuffledQuestions.length}`;
      }
    }

    function setStatusClass(element, correct) {
      clearStatusClass(element);
      if (correct) {
        element.classList.add('correct');
      } else {
        element.classList.add('wrong');
      }
    }

    function clearStatusClass(element) {
      element.classList.remove('correct');
      element.classList.remove('wrong');
    }

    const questions = [
      {
        question: "What is the term known as 'ax²'?",
        answers: [
          { text: 'Quadratic Term', correct: true },
          { text: 'Linear Term', correct: false },
          { text: 'Constant Term', correct: false },
          { text: 'Quadratic Equation', correct: false }
        ]
      },
      {
        question: "What is the binomial form of the PST: 'x² + 2x + 1'?",
        answers: [
          { text: '(x + 1)²', correct: true },
          { text: '(x-1)²', correct: false },
          { text: '(x+2)²', correct: false },
          { text: 'None of the above', correct: false }
        ]
      },
      {
        question: "If a > 0, what is the opening of the graph?",
        answers: [
          { text: 'Downwards', correct: false },
          { text: 'Upwards', correct: true },
          { text: 'Parabola', correct: false },
          { text: 'Straight Line', correct: false }
        ]
      },
      {
        question: "Of what conditional do facts and statements reside in?",
        answers: [
          { text: 'First Conditional', correct: false },
          { text: 'Zero Conditional', correct: true },
          { text: 'Second Conditional', correct: false },
          { text: 'Third Conditional', correct: false }
        ]
      },
      {
        question: "Which circulation is responsible for the lungs and heart?",
        answers: [
          { text: 'Systemic Circulation', correct: false },
          { text: 'Pulmonary Circulation', correct: true },
          { text: 'Cardiovascular System', correct: false },
          { text: 'None of the above', correct: false }
        ]
      },
      {
        question: "____ is the variety of life on earth.",
        answers: [
          { text: 'Genetics', correct: false },
          { text: 'Biodiversity', correct: true },
          { text: 'Species', correct: false },
          { text: 'Race', correct: false }
        ]
      },
      {
